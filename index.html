<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#284b3c"><title>My Life Stories</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><h1>PETE'S STORIES</h1><p class="intro">Press Start, tell your story, then press Stop.</p></header>
